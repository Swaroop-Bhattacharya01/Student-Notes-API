{% extends 'base.html' %}
{% block content %}
  <div class="card fade-in">
    <form method="post" enctype="multipart/form-data">
      <label for="title">Title</label>
      <input id="title" name="title" value="{{ note.title if note else '' }}" required />

      <label for="content">Content</label>
      <textarea id="content" name="content" rows="8" required>{{ note.content if note else '' }}</textarea>

      <label for="tags">Tags (comma separated)</label>
      <input id="tags" name="tags" value="{{ (', '.join(note.tags)) if (note and note.tags) else '' }}" />

      <label for="files">Attachments (PDF, images, etc.)</label>
      <input id="files" name="files" type="file" multiple />

      <div style="margin-top:14px; display:flex; gap:8px;">
        <button class="btn" type="submit">Save</button>
        <a class="btn secondary" href="/">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
